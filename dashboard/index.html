<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ID Generator Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            padding: 24px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }
        h1 {
            font-size: 24px;
            font-weight: 600;
        }
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #64748b;
        }
        .status-dot.ok { background: #22c55e; }
        .status-dot.degraded { background: #eab308; }
        .status-dot.down { background: #ef4444; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }
        .card {
            background: #1e293b;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #334155;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .card-title {
            font-size: 14px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .instance-id {
            font-size: 12px;
            color: #64748b;
            font-family: monospace;
        }
        .metric {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #334155;
        }
        .metric:last-child {
            border-bottom: none;
        }
        .metric-label {
            font-size: 14px;
            color: #94a3b8;
        }
        .metric-value {
            font-size: 18px;
            font-weight: 600;
            font-family: monospace;
        }
        .metric-value.ok { color: #22c55e; }
        .metric-value.degraded { color: #eab308; }
        .metric-value.down { color: #ef4444; }
        .instance {
            margin-bottom: 16px;
        }
        .instance:last-child {
            margin-bottom: 0;
        }
        .instance-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .instance-name {
            font-size: 14px;
            font-weight: 500;
        }
        .instance-badge {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 500;
        }
        .instance-badge.ok {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
        }
        .instance-badge.degraded {
            background: rgba(234, 179, 8, 0.2);
            color: #eab308;
        }
        .instance-badge.down {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }
        .instance-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 12px;
            color: #94a3b8;
        }
        .stat {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .stat-value {
            font-family: monospace;
            color: #e2e8f0;
        }
        .timestamp {
            font-size: 12px;
            color: #64748b;
            margin-top: 8px;
        }
        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            padding: 16px;
            color: #ef4444;
            text-align: center;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .loading {
            animation: pulse 1.5s infinite;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>ID Generator Dashboard</h1>
        <div class="status-indicator">
            <div class="status-dot" id="globalStatus"></div>
            <span id="globalStatusText">Connecting...</span>
        </div>
    </div>

    <div class="grid">
        <div class="card">
            <div class="card-header">
                <span class="card-title">Total IDs Generated</span>
            </div>
            <div class="metric">
                <span class="metric-label">Across All Instances</span>
                <span class="metric-value" id="totalIds">-</span>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <span class="card-title">Instances</span>
            </div>
            <div class="metric">
                <span class="metric-label">Healthy</span>
                <span class="metric-value ok" id="healthyCount">-</span>
            </div>
            <div class="metric">
                <span class="metric-label">Degraded</span>
                <span class="metric-value degraded" id="degradedCount">-</span>
            </div>
            <div class="metric">
                <span class="metric-label">Down</span>
                <span class="metric-value down" id="downCount">-</span>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <span class="card-title">System Uptime</span>
            </div>
            <div class="metric">
                <span class="metric-label">Average</span>
                <span class="metric-value" id="avgUptime">-</span>
            </div>
        </div>
    </div>

    <div class="grid">
        <div class="card" style="grid-column: span 2;">
            <div class="card-header">
                <span class="card-title">Generator Instances</span>
            </div>
            <div id="instancesContainer">
                <div class="loading" style="text-align: center; color: #64748b;">Loading instances...</div>
            </div>
        </div>
    </div>

    <div class="timestamp" id="lastUpdate">
        Last update: -
    </div>

    <script>
        const API_URL = window.env ? window.env.API_URL : 'http://localhost:80';
        const INSTANCES = [
            { name: 'Generator 1', port: 5001 },
            { name: 'Generator 2', port: 5002 },
            { name: 'Generator 3', port: 5003 }
        ];
        const POLL_INTERVAL = 5000;

        let instances = [];

        async function fetchHealth(instance) {
            try {
                const response = await fetch(`http://localhost:${instance.port}/health`, {
                    method: 'GET',
                    signal: AbortSignal.timeout(3000)
                });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                return { ...instance, status: 'ok', data, error: null };
            } catch (error) {
                return { ...instance, status: 'down', data: null, error: error.message };
            }
        }

        async function fetchMetrics(instance) {
            try {
                const response = await fetch(`http://localhost:${instance.port}/metrics`, {
                    method: 'GET',
                    signal: AbortSignal.timeout(3000)
                });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const text = await response.text();
                const idsMatch = text.match(/ids_generated_total (\d+)/);
                return { idsGenerated: idsMatch ? parseInt(idsMatch[1]) : 0 };
            } catch (error) {
                return { idsGenerated: 0 };
            }
        }

        async function pollInstances() {
            const healthResults = await Promise.all(INSTANCES.map(fetchHealth));

            const metricsPromises = healthResults.map(async (inst) => {
                if (inst.status === 'ok') {
                    const metrics = await fetchMetrics(inst);
                    return { ...inst, idsGenerated: metrics.idsGenerated };
                }
                return inst;
            });

            instances = await Promise.all(metricsPromises);
            render();
        }

        function formatUptime(seconds) {
            if (typeof seconds !== 'number' || isNaN(seconds)) return '-';
            const days = Math.floor(seconds / 86400);
            const hours = Math.floor((seconds % 86400) / 3600);
            const mins = Math.floor((seconds % 3600) / 60);
            if (days > 0) return `${days}d ${hours}h`;
            if (hours > 0) return `${hours}h ${mins}m`;
            return `${mins}m`;
        }

        function render() {
            const healthyCount = instances.filter(i => i.status === 'ok').length;
            const degradedCount = instances.filter(i => i.status === 'degraded').length;
            const downCount = instances.filter(i => i.status === 'down').length;
            const totalIds = instances.reduce((sum, i) => sum + (i.idsGenerated || 0), 0);
            const avgUptime = instances
                .filter(i => i.status === 'ok' && i.data)
                .reduce((sum, i, _, arr) => sum + (i.data.uptime_seconds || 0) / arr.length, 0);

            document.getElementById('healthyCount').textContent = healthyCount;
            document.getElementById('degradedCount').textContent = degradedCount;
            document.getElementById('downCount').textContent = downCount;
            document.getElementById('totalIds').textContent = totalIds.toLocaleString();
            document.getElementById('avgUptime').textContent = formatUptime(avgUptime);

            const globalDot = document.getElementById('globalStatus');
            const globalText = document.getElementById('globalStatusText');
            if (downCount === instances.length) {
                globalDot.className = 'status-dot down';
                globalText.textContent = 'All Down';
            } else if (downCount > 0 || degradedCount > 0) {
                globalDot.className = 'status-dot degraded';
                globalText.textContent = 'Degraded';
            } else {
                globalDot.className = 'status-dot ok';
                globalText.textContent = 'All Healthy';
            }

            const container = document.getElementById('instancesContainer');
            container.innerHTML = instances.map(inst => {
                const statusClass = inst.status === 'ok' ? 'ok' : inst.status === 'degraded' ? 'degraded' : 'down';
                const badgeClass = statusClass;
                const badgeText = inst.status === 'ok' ? 'OK' : inst.status === 'degraded' ? 'DEGRADED' : 'DOWN';

                if (inst.status === 'down') {
                    return `
                        <div class="instance">
                            <div class="instance-header">
                                <span class="instance-name">${inst.name}</span>
                                <span class="instance-badge ${badgeClass}">${badgeText}</span>
                            </div>
                            <div class="error-message">
                                Connection failed: ${inst.error}
                            </div>
                        </div>
                    `;
                }

                return `
                    <div class="instance">
                        <div class="instance-header">
                            <span class="instance-name">${inst.name}</span>
                            <span class="instance-badge ${badgeClass}">${badgeText}</span>
                        </div>
                        <div class="instance-stats">
                            <div class="stat">
                                <span class="stat-label">Instance ID</span>
                                <span class="stat-value">${inst.data?.instance || '-'}</span>
                            </div>
                            <div class="stat">
                                <span class="stat-label">Uptime</span>
                                <span class="stat-value">${formatUptime(inst.data?.uptime_seconds)}</span>
                            </div>
                            <div class="stat">
                                <span class="stat-label">IDs Generated</span>
                                <span class="stat-value">${(inst.idsGenerated || 0).toLocaleString()}</span>
                            </div>
                            <div class="stat">
                                <span class="stat-label">Port</span>
                                <span class="stat-value">${inst.port}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('lastUpdate').textContent = `Last update: ${new Date().toLocaleTimeString()}`;
        }

        pollInstances();
        setInterval(pollInstances, POLL_INTERVAL);
    </script>
</body>
</html>
