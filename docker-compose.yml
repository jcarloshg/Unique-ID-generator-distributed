version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: id_generator
      POSTGRES_USER: app
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d id_generator"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - id-generator-net

  generator-1:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATACENTER_ID: 1
      MACHINE_ID: 1
      PORT: 5001
      PERSISTENCE_ENABLED: "true"
      POSTGRES_DSN: "postgresql://app:changeme@postgres:5432/id_generator"
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - id-generator-net

  generator-2:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATACENTER_ID: 1
      MACHINE_ID: 2
      PORT: 5001
      PERSISTENCE_ENABLED: "true"
      POSTGRES_DSN: "postgresql://app:changeme@postgres:5432/id_generator"
    ports:
      - "5002:5001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - id-generator-net

  generator-3:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATACENTER_ID: 1
      MACHINE_ID: 3
      PORT: 5001
      PERSISTENCE_ENABLED: "true"
      POSTGRES_DSN: "postgresql://app:changeme@postgres:5432/id_generator"
    ports:
      - "5003:5001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - id-generator-net

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - generator-1
      - generator-2
      - generator-3
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/nginx_health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - id-generator-net

  dashboard:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./dashboard/index.html:/usr/share/nginx/html/index.html:ro
    networks:
      - id-generator-net

networks:
  id-generator-net:
    driver: bridge
